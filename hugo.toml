baseURL = 'https://misixipee1108.github.io/'
locale = 'zh-CN'
title = 'Misixipee 的个人主页'
theme = 'zen'

# 启用 emoji 支持
enableEmoji = true

# 代码高亮
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # 允许 HTML 内嵌
    [markup.goldmark.extensions.passthrough]
      enable = true
      [markup.goldmark.extensions.passthrough.delimiters]
        block = [['$$', '$$']]
        inline = [['$', '$']]
  [markup.highlight]
    style = 'github'
    noClasses = false

  # 目录层级（侧边栏目录包含到 h4，如 2.1）
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 4

# 分类法
[taxonomies]
  tag = 'tags'
  category = 'categories'

# 永久链接
[permalinks]
  notes = '/notes/:slug/'
  articles = '/articles/:slug/'
  thoughts = '/thoughts/:slug/'

# 分页
[pagination]
  pagerSize = 10
  path = 'page'

# 输出格式（首页额外生成 JSON 搜索索引）
[outputs]
  home = ["HTML", "RSS", "JSON"]

# 站点参数
[params]
  author = 'Misixipee'
  description = '个人主页 — 项目成果 / 学习笔记 / 观点文章'
  avatar = '/images/prob.jpg'

  # 社交链接
  [[params.social]]
    name = 'GitHub'
    url = 'https://github.com/misixipee1108'
    icon = 'github'
  [[params.social]]
    name = 'Bilibili'
    url = 'https://space.bilibili.com/332411964'
    icon = 'bilibili'

  # 导航
  [[params.nav]]
    name = '项目'
    url = '/projects/'
  [[params.nav]]
    name = '笔记'
    url = '/notes/'
  [[params.nav]]
    name = '文章'
    url = '/articles/'
  [[params.nav]]
    name = '杂谈'
    url = '/thoughts/'

  # 分析
  [params.analytics]
    provider = 'umami'  # 'google' 或 'umami'
    googleId = ''  # GA4 Measurement ID
    umamiId = 'c3b6c8f5-18d5-4fb9-a455-4b2fee8ad220'  # Umami Website ID
    umamiSrc = 'https://cloud.umami.is/script.js'  # Umami 脚本 URL

  # 评论与点赞（Waline）
  [params.comments]
    enable = true  # 全局开关；单篇文章可用 front matter 的 comments: false 关闭
    [params.comments.waline]
      serverURL = 'https://misixipee1108githubiodata.vercel.app'  # Waline 后端地址

  # 动效
  [params.motion]
    enabled = true  # 首次访问时的默认状态（读者可用页头按钮自行开关，选择会记住）

# 首页显示最近文章数
[params.home]
  recentLimit = 2
