<footer class="footer">
  <div class="footer__inner">
    <p>&copy; {{ now.Year }} {{ site.Params.author }} · Powered by <a href="https://gohugo.io" target="_blank" rel="noopener">Hugo</a> &amp; <a href="https://github.com/misixipee1108/misixipee1108.github.io" target="_blank" rel="noopener">Zen</a></p>
    {{ with site.Params.social }}
    <div class="footer__social">
      <a href="{{ "index.xml" | relURL }}" title="RSS 订阅" rel="alternate" type="application/rss+xml">RSS</a>
      {{ range . }}
        <a href="{{ .url }}" target="_blank" rel="noopener" title="{{ .name }}">{{ .name }}</a>
      {{ end }}
    </div>
    {{ end }}
  </div>
</footer>
