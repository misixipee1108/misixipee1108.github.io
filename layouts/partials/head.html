<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<!-- 防止主题切换闪白：在 CSS 加载前立即应用正确的主题 -->
<script>
  (function(){var t=localStorage.getItem('theme-preference');if(!t){t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}document.documentElement.className='theme-'+t;document.documentElement.classList.add('js')})();
</script>
<!-- 动效偏好：在渲染前应用，防止动画闪跳 -->
<script>
  (function(){
    var m = localStorage.getItem('motion-preference');
    if (m === null) m = {{ if eq site.Params.motion.enabled false }}'off'{{ else }}'on'{{ end }};
    if (m === 'off') document.documentElement.classList.add('motion-off');
  })();
</script>
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}</title>

<meta name="description" content="{{ if .IsHome }}{{ site.Params.description }}{{ else }}{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}{{ end }}" />
<meta name="author" content="{{ site.Params.author }}" />
<!-- Favicon（原创太空风 SVG） -->
<link rel="icon" type="image/svg+xml" href="{{ "favicon.svg" | relURL }}" />
<!-- Bing Webmaster 验证 -->
<meta name="msvalidate.01" content="886C1368C074ADAA85AC6CBF5FE06308" />

<!-- Open Graph -->
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} — {{ site.Title }}{{ end }}" />
<meta property="og:description" content="{{ if .IsHome }}{{ site.Params.description }}{{ else }}{{ with .Description }}{{ . }}{{ else }}{{ with .Summary }}{{ . | truncate 160 }}{{ else }}{{ site.Params.description }}{{ end }}{{ end }}{{ end }}" />
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}" />
<meta property="og:url" content="{{ .Permalink }}" />

<!-- Canonical -->
<link rel="canonical" href="{{ .Permalink }}" />

<!-- Structured Data (JSON-LD) -->
<script type="application/ld+json">
{{- if .IsPage -}}
{{ dict
  "@context" "https://schema.org"
  "@type" "Article"
  "headline" .Title
  "datePublished" (.PublishDate.Format "2006-01-02T15:04:05Z07:00")
  "dateModified" (.Lastmod.Format "2006-01-02T15:04:05Z07:00")
  "author" (dict "@type" "Person" "name" site.Params.author)
  "publisher" (dict "@type" "Organization" "name" site.Title)
  "url" .Permalink
  "mainEntityOfPage" (dict "@type" "WebPage" "@id" .Permalink)
  | jsonify | safeJS }}
{{- else -}}
{{ dict
  "@context" "https://schema.org"
  "@type" "WebSite"
  "name" site.Title
  "url" site.Home.Permalink
  | jsonify | safeJS }}
{{- end -}}
</script>

<!-- 字体就绪门控：页面在字体可用前隐藏（杜绝回退字体闪烁）；3 秒兜底防卡死 -->
<script>
  (function () {
    var html = document.documentElement;
    if (!('fonts' in document)) return;
    var opened = false;
    function open() {
      if (opened) return;
      opened = true;
      html.classList.remove('wf-gate');
      html.classList.add('wf-ready');
    }
    html.classList.add('wf-gate');
    var timer = setTimeout(open, 3000);
    document.fonts.ready.then(function () { clearTimeout(timer); open(); });
  })();
</script>
<!-- CSS -->
{{ $css := resources.Get "css/main.css" | resources.Minify | resources.Fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" />

<!-- Web 字体（同步加载：保证字体先于首帧绘制注册，页面切换不再闪烁；jsdelivr 国内可达；按 unicode-range 按需加载子集）
     正文：Noto Serif SC（500/700）；界面/导航：Noto Sans SC（400/700）；
     技术标注：IBM Plex Mono（400/500）；英文装饰：Bodoni Moda Italic（600） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/500.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc/700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc/400.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc/700.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/400.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/ibm-plex-mono/500.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/bodoni-moda/600-italic.css" />

<!-- RSS -->
{{ range .AlternativeOutputFormats }}
  {{ printf `<link rel="%s" type="%s" href="%s" title="%s" />` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }}
{{ end }}
